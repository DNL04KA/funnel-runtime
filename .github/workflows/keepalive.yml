# Резервный будильник для бесплатного инстанса Render.
#
# Основную работу делает самопинг внутри приложения (server/src/keepalive.ts):
# пока инстанс жив, он сам себя поддерживает и не даёт таймеру простоя
# сработать. Но разбудить уже уснувший контейнер изнутри невозможно — для
# этого и нужен внешний запрос.
#
# На расписание GitHub здесь полагаться нельзя: на бесплатных раннерах cron
# душится, и заявленные пять минут на практике превращаются в 2–10 часов.
# Поэтому workflow написан так, чтобы редкий запуск был максимально полезным:
# он не просто стучится один раз, а дожидается, пока холодный старт
# завершится.
#
# Включение: Settings → Secrets and variables → Actions → Variables →
# переменная DEMO_URL со значением вида https://example.onrender.com
# Без неё workflow ничего не делает.
name: keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Разбудить стенд
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          if [ -z "${DEMO_URL}" ]; then
            echo "Переменная DEMO_URL не задана — пропускаю."
            exit 0
          fi

          # Спящий инстанс отвечает 502/503, пока роутер поднимает контейнер.
          # Это не ошибка, а ожидаемое состояние: ждём и пробуем снова.
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "${DEMO_URL}/api/health" || echo 000)
            echo "попытка ${attempt}: ${DEMO_URL}/api/health → ${code}"
            if [ "${code}" = "200" ]; then
              echo "Стенд отвечает."
              exit 0
            fi
            sleep 20
          done

          echo "::error::Стенд не ответил 200 за восемь попыток (~3 минуты)."
          exit 1
